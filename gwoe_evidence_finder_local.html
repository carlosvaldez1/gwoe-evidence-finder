<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Gemeinwohl Evidence Finder (lite)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

  :root{
    --bg: #F5F5F0;
    --panel: #FFFFFF;
    --ink: #1F2420;
    --ink-soft: #6B7268;
    --line: #DCDED4;
    --accent: #3C6B45;
  }

  *{ box-sizing: border-box; }

  body{
    font-family: 'Inter', sans-serif;
    max-width: 820px;
    margin: 36px auto;
    padding: 0 20px 60px;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.5;
  }

  h1{ font-size: 22px; font-weight: 600; margin-bottom: 4px; }
  h1 + p{ color: var(--ink-soft); font-size: 13px; margin-top: 0; margin-bottom: 24px; }
  h2{ font-size: 15px; font-weight: 600; margin: 0 0 12px; }

  .panel{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 18px 20px;
    margin-bottom: 18px;
  }

  .dropzone{
    border: 1.5px dashed var(--line);
    border-radius: 6px;
    padding: 24px;
    text-align: center;
    cursor: pointer;
    font-size: 13.5px;
    color: var(--ink-soft);
    transition: border-color .15s, background .15s;
  }
  .dropzone:hover, .dropzone.dragover{
    border-color: var(--accent);
    background: #F0F4EF;
  }

  #uploadStatus{
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-top: 8px;
    min-height: 16px;
  }

  .doc-item{
    display: flex;
    justify-content: space-between;
    align-items: center;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 8px 12px;
    margin-top: 8px;
    font-size: 13.5px;
    background: #FAFAF6;
  }
  .doc-item button{
    background: none;
    border: none;
    color: var(--ink-soft);
    font-size: 12px;
    cursor: pointer;
    padding: 2px 6px;
  }
  .doc-item button:hover{ color: #B0472E; }

  button{
    font-family: inherit;
    cursor: pointer;
  }
  #analyzeBtn{
    background: var(--ink);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 9px 18px;
    font-size: 13.5px;
    font-weight: 500;
    margin: 6px 0 14px;
  }
  #analyzeBtn:hover{ background: #34392E; }

  .topic-tab{
    padding: 6px 14px;
    border: 1px solid var(--line);
    border-radius: 16px;
    margin: 0 6px 6px 0;
    background: #fff;
    font-size: 12.5px;
    color: var(--ink-soft);
  }
  .topic-tab.active{
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  #topicDesc{ font-size: 13px; color: var(--ink-soft); margin: 8px 0 14px; }

  .evidence-card{
    border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    border-radius: 6px;
    padding: 12px 14px;
    margin-top: 10px;
    background: #FAFAF6;
  }
  .evidence-card p:first-child{
    font-size: 14.5px;
    margin: 0 0 6px;
  }
  .evidence-card small{
    font-size: 11px;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: .02em;
  }
  .evidence-card em{
    display: block;
    font-size: 12.5px;
    color: var(--ink-soft);
    font-style: normal;
    margin-top: 6px;
    padding-top: 6px;
    border-top: 1px dashed var(--line);
  }
</style>
</head>
<body>

<h1>Gemeinwohl Evidence Finder</h1>
<p>Logic-only demo — upload documents, pick a topic, see source-linked evidence.</p>

<div class="panel">
  <h2>Documents</h2>
  <div class="dropzone" id="dropzone">Drop files here or click to choose (.pdf .docx .txt)</div>
  <input type="file" id="fileInput" multiple accept=".pdf,.docx,.txt,.md" style="display:none">
  <div id="uploadStatus"></div>
  <div id="docList"></div>
</div>

<div class="panel">
  <h2>Topic</h2>
  <div id="topicTabs"></div>
  <p id="topicDesc"></p>
  <button id="analyzeBtn">Find evidence</button>
  <div id="resultsBody"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script>
if (window.pdfjsLib){
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}

// ---------- Data ----------

const TOPICS = [
  { id: 'dignity', label: 'Human dignity', desc: 'Working conditions, fair treatment, health & safety.' },
  { id: 'solidarity', label: 'Solidarity & justice', desc: 'Fair pricing, profit distribution, support for stakeholders.' },
  { id: 'ecology', label: 'Ecological sustainability', desc: 'Environmental impact, resource use, sustainable sourcing.' },
  { id: 'transparency', label: 'Transparency & co-determination', desc: 'Openness of decision-making, stakeholder participation.' },
];

let documents = [];
let activeTopic = TOPICS[0].id;
let resultsByTopic = {};
const el = (id) => document.getElementById(id);

// Storage (localStorage)

function loadState(){
  documents = JSON.parse(localStorage.getItem('gwoe:documents') || '[]');
  resultsByTopic = JSON.parse(localStorage.getItem('gwoe:results') || '{}');
  renderDocs();
  renderTopics();
  renderResults();
}
function saveDocs(){ localStorage.setItem('gwoe:documents', JSON.stringify(documents)); }
function saveResults(){ localStorage.setItem('gwoe:results', JSON.stringify(resultsByTopic)); }

// Rendering

function renderDocs(){
  el('docList').innerHTML = documents.map(d =>
    `<div class="doc-item">${d.name} — ${d.text.split(/\s+/).length} words
     <button onclick="removeDoc('${d.id}')">Remove</button></div>`
  ).join('') || '<p>No documents yet.</p>';
}

function removeDoc(id){
  documents = documents.filter(d => d.id !== id);
  saveDocs();
  renderDocs();
}

function renderTopics(){
  el('topicTabs').innerHTML = TOPICS.map(t =>
    `<button class="topic-tab ${t.id === activeTopic ? 'active' : ''}" onclick="selectTopic('${t.id}')">${t.label}</button>`
  ).join('');
  el('topicDesc').textContent = TOPICS.find(t => t.id === activeTopic).desc;
}

function selectTopic(id){
  activeTopic = id;
  renderTopics();
  renderResults();
}

function renderResults(){
  const cached = resultsByTopic[activeTopic];
  if (!cached){ el('resultsBody').innerHTML = '<p>No evidence gathered yet.</p>'; return; }
  el('resultsBody').innerHTML = cached.evidence.map(ev =>
    `<div class="evidence-card">
       <p>"${ev.quote}"</p>
       <small>${ev.source} — ${ev.confidence} confidence</small>
       <p><em>${ev.reasoning}</em></p>
     </div>`
  ).join('') || '<p>No evidence found for this topic.</p>';
}

//File upload + text extraction 

async function extractText(file){
  const ext = file.name.split('.').pop().toLowerCase();

  if (ext === 'txt' || ext === 'md'){
    return (await file.text()).trim();
  }

  if (ext === 'pdf'){
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    let text = '';
    for (let i = 1; i <= pdf.numPages; i++){
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      text += content.items.map(it => it.str).join(' ') + '\n';
    }
    if (!text.trim()) throw new Error('No text found (scanned PDF?)');
    return text.trim();
  }

  if (ext === 'docx'){
    const buf = await file.arrayBuffer();
    const result = await mammoth.extractRawText({ arrayBuffer: buf });
    if (!result.value.trim()) throw new Error('No text found in this .docx');
    return result.value.trim();
  }

  throw new Error('Unsupported file type: .' + ext);
}

async function handleFiles(fileList){
  for (const file of Array.from(fileList)){
    el('uploadStatus').textContent = `Reading ${file.name}...`;
    try{
      const text = await extractText(file);
      documents.push({ id: 'd' + Date.now() + Math.random(), name: file.name, text });
      saveDocs();
      el('uploadStatus').textContent = `Added ${file.name}`;
    }catch(e){
      el('uploadStatus').textContent = `Failed: ${file.name} — ${e.message}`;
    }
    renderDocs();
  }
}

const dropzone = el('dropzone');
const fileInput = el('fileInput');
dropzone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', (e) => handleFiles(e.target.files));
dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('dragover'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
dropzone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropzone.classList.remove('dragover');
  handleFiles(e.dataTransfer.files);
});

// AI analysis (calls local backend -> Ollama) ----------

el('analyzeBtn').addEventListener('click', async () => {
  if (documents.length === 0) return;
  const topic = TOPICS.find(t => t.id === activeTopic);
  el('resultsBody').innerHTML = `<p>Analyzing ${documents.length} document(s)...</p>`;

  try{
    const response = await fetch("http://localhost:8000/api/extract", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        topic_label: topic.label,
        topic_desc: topic.desc,
        documents: documents.map(d => ({ name: d.name, text: d.text }))
      })
    });
    const data = await response.json();
    resultsByTopic[activeTopic] = { evidence: data.evidence || [] };
    saveResults();
  }catch(e){
    el('resultsBody').innerHTML = '<p>Could not reach backend at localhost:8000. Is uvicorn running?</p>';
    return;
  }
  renderResults();
});

loadState();
</script>
</body>
</html>
